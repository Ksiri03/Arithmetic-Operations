apiVersion: v1
kind: Service
metadata:
  name: arithmetic-service
  namespace: arithmetic
  labels:
    app: arithmetic-app
    app.kubernetes.io/name: arithmetic-operations
spec:
  type: NodePort
  selector:
    app: arithmetic-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30081
